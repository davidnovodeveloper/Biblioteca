<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Biblioteca</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>TU BIBLIOTECA</h1>
        <form>
            <input type="text" id="name" class="inputs" placeholder="the name">
            <input type="text" id="author" class="inputs" placeholder="the author">
            <input type="number"id="pages" class="inputs" placeholder="the pages">
            <div class="radios-inline">
                <h4>Readed?</h4>
                <input type="radio" id="treaded" name="readed" value="false">
                <input type="radio" id="freaded" name="readed" value="true">
            </div>
        </form>
        <div id="container"></div>
        <script src="script.js"></script>
    </body>
</html>
